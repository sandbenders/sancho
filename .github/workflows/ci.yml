name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    # Pinned, so a change of runner image never changes what is tested.
    runs-on: ubuntu-24.04
    env:
      ODIN_VERSION: dev-2026-10
    steps:
      - uses: actions/checkout@v4
      - name: Install Odin
        run: |
          mkdir -p "$HOME/odin"
          curl -fsSL "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/odin-linux-amd64-$ODIN_VERSION.tar.gz" \
            | tar -xzf - -C "$HOME/odin" --strip-components=1
          echo "$HOME/odin" >> "$GITHUB_PATH"
      - run: odin version
      - name: Tests
        run: |
          odin test deflate -vet -strict-style
          odin test png_writer -vet -strict-style
      - name: Tests, optimised
        run: |
          odin test deflate -o:speed
          odin test png_writer -o:speed
      - name: Example
        run: |
          odin run examples/gradient -vet -strict-style
          test -s gradient.png && test -s grey16.png
